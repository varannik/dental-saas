[project]
name = "dental-evidence"
version = "0.1.0"
description = "Evidence service: retrieval, contradiction scoring, confidence and the research lab."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
