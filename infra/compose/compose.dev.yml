name: dental-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dental
    # Host 5433 avoids a local Postgres and other projects already bound to 5432.
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dental']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dental

  valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes']
    # Host 6380 avoids another project's Redis already bound to 6379.
    ports:
      - '6380:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dental

  seaweedfs:
    image: chrislusf/seaweedfs:3.85
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
      - '9333:9333'
    volumes:
      - seaweed_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dental

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/devpassword
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - dental

volumes:
  postgres_data:
  valkey_data:
  seaweed_data:
  neo4j_data:

networks:
  dental:
